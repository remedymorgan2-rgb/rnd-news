<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REMEDY NEWS DROP - Nigeria's Breaking News</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { animation: marquee 25s linear infinite; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-white text-gray-900">

  <header class="sticky top-0 z-50 bg-black text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="font-serif font-black text-lg md:text-xl">REMEDY <span class="text-green-600">NEWS</span> <span class="text-red-600">DROP</span></a>
      <a href="admin.html" class="text-xs bg-green-600 px-3 py-1 rounded font-bold hover:bg-green-700 transition">ADMIN</a>
    </div>
  </header>

  <div id="ticker" class="bg-red-600 text-white py-2 overflow-hidden whitespace-nowrap hidden">
    <div class="inline-block animate-marquee">
      <span class="font-black mr-3">🚨 BREAKING:</span>
      <span id="breaking-news"></span>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div id="hero" class="mb-8 flex items-center justify-center min-h-[200px]">
      <p class="text-gray-400">Loading latest news...</p>
    </div>
    <h2 class="font-serif font-black text-xl border-l-4 border-green-600 pl-3 mb-4 uppercase mt-8">Latest News</h2>
    <div id="news-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4"></div>
  </main>

  <footer class="bg-black text-white py-8 mt-8">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="font-serif font-black text-xl">REMEDY <span class="text-green-600">NEWS</span> <span class="text-red-600">DROP</span></p>
      <p class="text-gray-400 text-xs mt-2">&copy; 2026 RND. Nigeria's Breaking News Platform.</p>
    </div>
  </footer>

  <!-- FIREBASE TO LOAD NEWS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // USE THE SAME FIREBASE CONFIG AS YOUR ADMIN PANEL
    const firebaseConfig = {
      apiKey: "AIzaSyAyNdQEZ4Jqj8FezBKTeWxAO773FN3qVsA",
      authDomain: "deprince-auto.firebaseapp.com",
      projectId: "deprince-auto",
      storageBucket: "deprince-auto.firebasestorage.app",
      messagingSenderId: "1091473342949",
      appId: "1:1091473342949:web:ee837087d4a6e089f46f0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = query(collection(db, "rnd_news"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      const news = [];
      snapshot.forEach((doc) => {
        news.push({ id: doc.id, ...doc.data() });
      });

      // 1. Render Breaking Ticker
      const brk = news.filter(n => n.breaking);
      if (brk.length) {
        document.getElementById('ticker').classList.remove('hidden');
        document.getElementById('breaking-news').innerHTML = brk.map(n => 
          `<span class="mx-4"><a href="article.html?id=${n.id}" class="hover:underline">${n.title}</a></span>`
        ).join('');
      }
      
      // 2. Render Hero (Latest Post)
      if (news[0]) {
        const h = news[0];
        const date = new Date(h.createdAt).toLocaleDateString('en-NG', {year:'numeric',month:'short',day:'numeric'});
        document.getElementById('hero').innerHTML = `
          <a href="article.html?id=${h.id}" class="block group">
            <div class="grid md:grid-cols-2 gap-4 items-center">
              <img src="${h.imgUrl}" alt="${h.title}" class="w-full aspect-[4/5] md:aspect-video object-cover rounded-xl group-hover:scale-105 transition-transform" />
              <div>
                <span class="bg-red-600 text-white text-xs font-black px-3 py-1 rounded-full uppercase">${h.category}</span>
                <h1 class="font-serif font-black text-2xl md:text-4xl mt-3 uppercase leading-tight group-hover:text-green-600 transition">${h.title}</h1>
                <p class="mt-3 text-gray-600 text-sm md:text-base">${h.excerpt}</p>
                <p class="mt-3 text-xs text-gray-400">By ${h.author || 'Remedy Morgan'} · ${date}</p>
              </div>
            </div>
          </a>
        `;
      }
      
      // 3. Render News Grid (Posts 2 to 9)
      const gridItems = news.slice(1, 9);
      if (gridItems.length > 0) {
        document.getElementById('news-grid').innerHTML = gridItems.map(n => `
          <a href="article.html?id=${n.id}" class="group block">
            <img src="${n.imgUrl}" alt="${n.title}" class="w-full aspect-[4/5] object-cover rounded-lg group-hover:scale-105 transition-transform" loading="lazy" />
            <span class="text-[10px] font-black text-red-600 uppercase mt-2 block">${n.category}</span>
            <h3 class="font-bold text-xs mt-1 uppercase leading-snug group-hover:text-green-600 transition line-clamp-3">${n.title}</h3>
          </a>
        `).join('');
      }
    });
  </script>
</body>
</html>
