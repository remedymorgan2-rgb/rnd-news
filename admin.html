<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RND Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6 mt-4">
    <h1 class="text-2xl font-bold mb-4 text-center">📝 CREATE NEWS</h1>
    
    <input type="text" id="title" placeholder="News Title" class="w-full border p-2 mb-3 rounded">
    
    <select id="category" class="w-full border p-2 mb-3 rounded">
      <option>Health</option>
      <option>Politics</option>
      <option>Crime</option>
      <option>Business</option>
      <option>Sports</option>
    </select>
    
    <input type="text" id="image" placeholder="Image URL (use imgur.com)" class="w-full border p-2 mb-3 rounded">
    
    <input type="text" id="excerpt" placeholder="Short summary" class="w-full border p-2 mb-3 rounded">
    
    <label class="flex items-center mb-3">
      <input type="checkbox" id="breaking" class="mr-2"> Breaking News?
    </label>
    
    <textarea id="body" rows="6" placeholder="Full story..." class="w-full border p-2 mb-3 rounded"></textarea>
    
    <button onclick="publish()" class="w-full bg-green-600 text-white font-bold py-3 rounded">📤 PUBLISH</button>
    
    <div id="msg" class="mt-3 text-center hidden"></div>
  </div>

  <script>
    async function publish() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const image = document.getElementById('image').value;
      const excerpt = document.getElementById('excerpt').value;
      const breaking = document.getElementById('breaking').checked;
      const body = document.getElementById('body').value;
      
      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const date = new Date().toISOString().split('T')[0];
      
      const content = `---
title: "${title}"
category: "${category}"
image: "${image}"
excerpt: "${excerpt}"
breaking: ${breaking}
author: "Remedy Morgan"
date: ${date}
---

${body}`;

      const token = prompt('Enter your GitHub token:');
      if (!token) return;

      const path = `content/news/${slug}.md`;
      const repo = 'remedymorgan2-rgb/rnd-news';
      
      try {
        await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'New: ' + title,
            content: btoa(unescape(encodeURIComponent(content)))
          })
        });
        
        const msg = document.getElementById('msg');
        msg.textContent = '✅ Published! Go to homepage to see it.';
        msg.className = 'mt-3 text-center text-green-600 font-bold';
        msg.classList.remove('hidden');
        
        setTimeout(() => window.location.href = '/rnd-news/', 2000);
      } catch(e) {
        alert('Error: ' + e.message);
      }
    }
  </script>
</body>
</html>
